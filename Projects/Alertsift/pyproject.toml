[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alertsift"
version = "1.0.0"
description = "Explainable security alert triage: de-duplicate, group, score and rank alerts from auth, firewall, web, email and DNS logs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dhanush Bharathi M" }]
keywords = ["security", "soc", "alert-triage", "blue-team", "detection", "siem", "phishing", "incident-response"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
alertsift = "alertsift.cli:main"

[tool.setuptools.packages.find]
include = ["alertsift*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
